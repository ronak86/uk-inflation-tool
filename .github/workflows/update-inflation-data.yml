name: Update inflation data

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the expected month is already live
        required: false
        type: boolean
        default: false
      trigger_source:
        description: Where this dispatch came from
        required: false
        type: string
        default: manual
  schedule:
    # Daily late backup. The release-date file and duplicate guard make other days no-ops.
    - cron: "30 8 * * *"

concurrency:
  group: update-inflation-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check release date and current data
        id: date-check
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: |
          today="$(TZ=Europe/London date +%Y-%m-%d)"
          expected_month="$(TZ=Europe/London date -d "${today} -1 month" +%Y-%m)"
          latest_month="$(python -c 'import json; print(json.load(open("web/data/inflation.json"))["series"]["CPI"]["months"][-1])')"
          is_release=false
          if grep --fixed-strings --line-regexp --quiet "$today" automation/inflation-release-dates.txt; then
            is_release=true
          fi

          echo "release_date=$today" >> "$GITHUB_OUTPUT"
          echo "expected_month=$expected_month" >> "$GITHUB_OUTPUT"
          echo "latest_month=$latest_month" >> "$GITHUB_OUTPUT"
          echo "trigger_source=${TRIGGER_SOURCE:-${{ github.event_name }}}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$is_release" != "true" ]; then
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "Today is not listed as a release date."
          elif [ "${FORCE_UPDATE:-false}" != "true" ] && [[ "$latest_month" > "$expected_month" || "$latest_month" == "$expected_month" ]]; then
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "The expected month $expected_month is already live; skipping duplicate run."
          else
            echo "run_update=true" >> "$GITHUB_OUTPUT"
            echo "Updating from $latest_month to expected month $expected_month."
          fi

      - name: Set up Python
        if: steps.date-check.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.date-check.outputs.run_update == 'true'
        run: python -m pip install --upgrade openpyxl

      - name: Set up Node
        if: steps.date-check.outputs.run_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        if: steps.date-check.outputs.run_update == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Install mobile test dependencies
        if: steps.date-check.outputs.run_update == 'true'
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Wait for ONS workbook and update source workbook
        if: steps.date-check.outputs.run_update == 'true'
        env:
          EXPECTED_MONTH: ${{ steps.date-check.outputs.expected_month }}
        shell: bash
        run: |
          max_attempts=16
          for attempt in $(seq 1 "$max_attempts"); do
            echo "ONS publication check ${attempt}/${max_attempts} for ${EXPECTED_MONTH}"
            set +e
            python -u scripts/update_workbook_from_ons.py \
              --download \
              --expected-month "$EXPECTED_MONTH" \
              --no-backup
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "ONS did not publish ${EXPECTED_MONTH} within the retry window." >&2
              exit 1
            fi
            sleep 120
          done

      - name: Rebuild website data
        if: steps.date-check.outputs.run_update == 'true'
        run: python scripts/export_inflation_data.py

      - name: Validate mobile calculations
        if: steps.date-check.outputs.run_update == 'true'
        working-directory: mobile
        run: |
          pnpm typecheck
          pnpm test

      - name: Commit and push updated data
        id: commit-push
        if: steps.date-check.outputs.run_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Weights And Prices.xlsx" web/data/inflation.json web/data/inflation-data.js mobile/assets/data/inflation.json
          if git diff --cached --quiet; then
            echo "No inflation data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update inflation data $(TZ=Europe/London date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send success email
        if: steps.date-check.outputs.run_update == 'true' && success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python scripts/send_notification_email.py \
            --subject "UK Inflation Tool website updated" \
            --body "The UK Inflation Tool update triggered by ${{ steps.date-check.outputs.trigger_source }} has finished successfully for ${{ steps.date-check.outputs.expected_month }}. Data changes committed: ${{ steps.commit-push.outputs.changed }}. Live site: https://chitroda.com/inflation.html"

      - name: Send failure email
        if: steps.date-check.outputs.run_update == 'true' && failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python scripts/send_notification_email.py \
            --subject "UK Inflation Tool update failed" \
            --body "The scheduled UK Inflation Tool update failed. Check the GitHub Actions run here: https://github.com/ronak86/uk-inflation-tool/actions/workflows/update-inflation-data.yml"
