name: Update inflation data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. July to October release times are 07:05 London / 06:05 UTC.
    - cron: "5 6 22 7 *"
    - cron: "5 6 19 8 *"
    - cron: "5 6 16 9 *"
    - cron: "5 6 21 10 *"
    # November to February release times are 07:05 London / 07:05 UTC.
    - cron: "5 7 18 11 *"
    - cron: "5 7 16 12 *"
    - cron: "5 7 20 1 *"
    - cron: "5 7 17 2 *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check release date
        id: date-check
        shell: bash
        run: |
          today="$(TZ=Europe/London date +%Y-%m-%d)"
          case "$today" in
            2026-07-22|2026-08-19|2026-09-16|2026-10-21|2026-11-18|2026-12-16|2027-01-20|2027-02-17)
              echo "run_update=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "run_update=true" >> "$GITHUB_OUTPUT"
              else
                echo "run_update=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Check out repo
        if: steps.date-check.outputs.run_update == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.date-check.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.date-check.outputs.run_update == 'true'
        run: python -m pip install --upgrade openpyxl

      - name: Set up Node
        if: steps.date-check.outputs.run_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        if: steps.date-check.outputs.run_update == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Install mobile test dependencies
        if: steps.date-check.outputs.run_update == 'true'
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Download ONS workbook and update source workbook
        if: steps.date-check.outputs.run_update == 'true'
        run: python -u scripts/update_workbook_from_ons.py --download

      - name: Rebuild website data
        if: steps.date-check.outputs.run_update == 'true'
        run: python scripts/export_inflation_data.py

      - name: Validate mobile calculations
        if: steps.date-check.outputs.run_update == 'true'
        working-directory: mobile
        run: |
          pnpm typecheck
          pnpm test

      - name: Commit and push updated data
        id: commit-push
        if: steps.date-check.outputs.run_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Weights And Prices.xlsx" web/data/inflation.json web/data/inflation-data.js mobile/assets/data/inflation.json
          if git diff --cached --quiet; then
            echo "No inflation data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update inflation data $(TZ=Europe/London date +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send success email
        if: steps.date-check.outputs.run_update == 'true' && success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python scripts/send_notification_email.py \
            --subject "UK Inflation Tool website updated" \
            --body "The scheduled UK Inflation Tool update has finished successfully. Data changes committed: ${{ steps.commit-push.outputs.changed }}. Live site: https://chitroda.com/inflation.html"

      - name: Send failure email
        if: steps.date-check.outputs.run_update == 'true' && failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python scripts/send_notification_email.py \
            --subject "UK Inflation Tool update failed" \
            --body "The scheduled UK Inflation Tool update failed. Check the GitHub Actions run here: https://github.com/ronak86/uk-inflation-tool/actions/workflows/update-inflation-data.yml"
