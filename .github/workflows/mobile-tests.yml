name: Mobile calculation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "scripts/export_inflation_data.py"
      - ".github/workflows/mobile-tests.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "scripts/export_inflation_data.py"
      - ".github/workflows/mobile-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: mobile
        run: pnpm typecheck

      - name: Run calculation tests
        working-directory: mobile
        run: pnpm test
