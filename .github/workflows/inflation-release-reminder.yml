name: Inflation release reminder

on:
  workflow_dispatch:
  schedule:
    # One of these is 21:00 London time. The job checks the local hour and tomorrow's date.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check reminder date
        id: date-check
        shell: bash
        run: |
          today="$(TZ=Europe/London date +%Y-%m-%d)"
          tomorrow="$(TZ=Europe/London date -d 'tomorrow' +%Y-%m-%d)"
          london_hour="$(TZ=Europe/London date +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_reminder=true" >> "$GITHUB_OUTPUT"
            echo "release_date=$tomorrow" >> "$GITHUB_OUTPUT"
          elif [ "$london_hour" = "21" ] && grep --fixed-strings --line-regexp --quiet "$tomorrow" automation/inflation-release-dates.txt; then
            echo "send_reminder=true" >> "$GITHUB_OUTPUT"
            echo "release_date=$tomorrow" >> "$GITHUB_OUTPUT"
          else
            echo "send_reminder=false" >> "$GITHUB_OUTPUT"
            echo "No 21:00 London reminder is due after ${today}."
          fi

      - name: Set up Python
        if: steps.date-check.outputs.send_reminder == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send reminder email
        if: steps.date-check.outputs.send_reminder == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python scripts/send_notification_email.py \
            --subject "UK Inflation Tool will update tomorrow" \
            --body "Inflation release is scheduled for ${{ steps.date-check.outputs.release_date }}. The Raspberry Pi will trigger the UK Inflation Tool update at 07:00:10 London time tomorrow morning. GitHub will retry automatically if ONS publishes late."
